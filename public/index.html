<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Calculated Paths</title>
  <link rel="icon" type="image/svg+xml" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="masthead">
    <div class="masthead-text">
      <h1>Calculated Paths</h1>
      <p id="context" class="context"></p>
    </div>
    <a class="settings-link" href="/admin/#/serverConfiguration/plugins/signalk-calc-paths">Edit plugin configuration</a>
  </header>

  <nav id="views" class="views" aria-label="Views" hidden>
    <a id="tab-status" href="#status" aria-current="page">Status</a>
    <a id="tab-edit" href="#edit">Edit entries<span id="unsaved-mark" class="unsaved-mark" hidden> (unsaved)</span></a>
  </nav>

  <main>
    <section id="status-view" aria-label="Status">
      <div id="notices" aria-live="polite"></div>
      <div class="sheet-tools">
        <button id="status-expand-all" type="button" class="is-quiet" hidden>Collapse all</button>
      </div>
      <div id="sheet" class="sheet"></div>
      <p id="placeholder" class="placeholder">Loading the calculated paths.</p>
    </section>
    <section id="edit-view" class="editor" aria-label="Edit entries" hidden></section>
  </main>

  <footer>
    <span id="refreshed"></span>
    <span id="version"></span>
  </footer>

  <script src="common.js"></script>
  <script src="status.js"></script>
  <script src="editor.js"></script>
  <script src="app.js"></script>
</body>
</html>
